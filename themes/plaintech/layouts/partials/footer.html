<footer>
  <p>
    {{ site.Title }} · {{ now.Year }} · backend systems, agents,
    infrastructure, CLI tools, and production details.
  </p>
  {{ with site.Params.social }}
  <ul class="social">
    {{ range . }}
    <li><a href="{{ .url }}">{{ .name }}</a></li>
    {{ end }}
  </ul>
  {{ end }}
</footer>
